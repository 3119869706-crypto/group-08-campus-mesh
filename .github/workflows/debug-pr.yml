name: Debug PR creation

on:
  push:
    paths:
      - ".github/workflows/debug-pr.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try creating a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "== auth =="
            gh auth status
            echo "== repo permission =="
            gh repo view --json name,viewerPermission
            echo "== create =="
            gh pr create \
              --base main \
              --head feature/2-anonymous-identity \
              --title "feat(identity): persist anonymous identity in localStorage" \
              --body "Closes #2"
            echo "exit=$?"
          } > pr-debug.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr-debug.txt
          git commit -m "chore: record PR debug output" || true
          git push origin HEAD:chore/pr-debug || true
