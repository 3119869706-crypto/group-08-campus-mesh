name: Seed backlog

on:
  push:
    paths:
      - "scripts/issues.json"
      - "scripts/seed_issues.sh"
      - ".github/workflows/seed-issues.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create feature --color 1F3864 --force
          gh label create bug --color C00000 --force
          gh label create test --color 548235 --force
          gh label create docs --color 7F7F7F --force
          gh label create chore --color BFBFBF --force
          gh label create frontend --color 2E75B6 --force
          gh label create backend --color 2E75B6 --force
          gh label create ai --color C55A11 --force
          gh label create webrtc --color C55A11 --force
          gh label create P0 --color C00000 --force
          gh label create P1 --color ED7D31 --force
          gh label create P2 --color A5A5A5 --force

      - name: Create milestones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/milestones" -f title="v0.1.0" -f description="Alpha - 第 8 周" || true
          gh api "repos/$GH_REPO/milestones" -f title="v0.2.0" -f description="Beta - 第 12 周" || true
          gh api "repos/$GH_REPO/milestones" -f title="v1.0.0" -f description="Final - 第 16 周" || true

      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/seed_issues.sh

      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seed-result.txt || true
          git commit -m "chore: record issue seeding result" || true
          git push origin HEAD:main || true
