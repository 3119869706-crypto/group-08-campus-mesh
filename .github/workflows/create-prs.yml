name: Create PRs via API

on:
  push:
    paths:
      - ".github/workflows/create-prs.yml"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          : > /tmp/prs.txt

          make_pr() {
            head="$1"
            title="$2"
            body="$3"
            payload=$(jq -n --arg t "$title" --arg h "$head" --arg b "$body" \
              '{title: $t, head: $h, base: "main", body: $b}')
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/pulls" \
              -d "$payload")
            {
              echo "=== $head -> HTTP $code"
              cat /tmp/resp.json
              echo
            } >> /tmp/prs.txt
          }

          make_pr "feature/2-anonymous-identity" \
            "feat(identity): persist anonymous identity in localStorage" \
            $'Closes #2\n\n- localStorage 身份持久化、刷新不变、重置二次确认\n- 新增 7 个前端单元测试\n- lint/typecheck/test/build 通过'

          make_pr "feature/3-signaling" \
            "feat(signaling): add room store and WebSocket relay" \
            $'Closes #3\n\n- RoomStore：6 位房间 / 4 位口令 / 24h / 5 次锁定\n- /ws/signal 转发 SDP/ICE，不解析 payload\n- 14 个测试，覆盖率 87.68%'

          make_pr "feature/5-docker" \
            "feat(deploy): add Dockerfile, compose and deployment guide" \
            $'Closes #5\n\n- 多阶段 Dockerfile（server/web）+ docker compose\n- Nginx 反代 /api 与 /ws\n- 部署文档；本机无 Docker，未实机构建'

          make_pr "chore/4-ci-release" \
            "chore(ci): add release workflow and protection docs" \
            $'Closes #4\n\n- v* tag 自动构建 + GitHub Release\n- Release Notes 分类\n- 发布流程与分支保护文档'

          gh issue comment 2 --body-file /tmp/prs.txt || true
