services:
  server:
    build:
      context: .
      target: server
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
